[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend"]
exclude = ["backend/alembic/versions", ".venv", "frontend", "mobile"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    "B008",    # FastAPI declares dependencies in the signature default.
    "ARG001",  # A stub route keeps its parameters for the OpenAPI contract.
]

[tool.ruff.lint.per-file-ignores]
# Stub routers declare parameters that no body reads yet. Phase 2 uses them.
"backend/app/routers/*.py" = ["ARG001"]
"backend/app/utils/auth.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
