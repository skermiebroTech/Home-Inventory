name: CI

# A pull request runs the checks only. A push to main also builds the image
# and pushes it to the GitHub container registry, which is where the Unraid
# template points.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    # The models use PostgreSQL types: a UUID primary key, JSONB, and a
    # generated tsvector column. The tests need a real server.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homestock
          POSTGRES_PASSWORD: homestock
          POSTGRES_DB: homestock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homestock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install the dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic

      - name: Test
        working-directory: backend
        env:
          # The suite reads this and skips its own embedded server.
          HS_TEST_DATABASE_URL: postgresql+asyncpg://homestock:homestock@localhost:5432/homestock_test
        run: pytest

      - name: Check that the migration matches the models
        working-directory: backend
        env:
          HS_SECRET_KEY: ci-only-secret-key-0123456789abcdef
          HS_DATABASE_URL: postgresql+asyncpg://homestock:homestock@localhost:5432/homestock
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check the types
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    name: Mobile types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the dependencies
        working-directory: mobile
        run: npm ci

      - name: Check the types
        working-directory: mobile
        run: npm run typecheck

  contract:
    name: The OpenAPI file is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate and compare
        run: |
          python scripts/dump_openapi.py
          if ! git diff --quiet docs/openapi.yaml; then
            echo "::error::docs/openapi.yaml is behind the routes."
            echo "Run: python scripts/dump_openapi.py"
            git diff --stat docs/openapi.yaml
            exit 1
          fi

  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, contract]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
