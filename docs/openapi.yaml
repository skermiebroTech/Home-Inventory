            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    AiJob:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kind:
          $ref: '#/components/schemas/AiJobKind'
        status:
          $ref: '#/components/schemas/AiJobStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Set when status is failed.
        recognize_result:
          anyOf:
          - $ref: '#/components/schemas/RecognizeResult'
          - type: 'null'
        receipt_result:
          anyOf:
          - $ref: '#/components/schemas/ParsedReceipt'
          - type: 'null'
      type: object
      required:
      - id
      - kind
      - status
      - created_at
      title: AiJob
      description: A unit of AI work, and its result when it is done.
    AiJobKind:
      type: string
      enum:
      - recognize
      - bulk_scan
      - receipt_parse
      title: AiJobKind
      description: What a job asked the model to do.
    AiJobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      title: AiJobStatus
      description: Where a job is in its life.
    AiStatus:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: False when HS_AI_ENABLED is off.
        reachable:
          type: boolean
          title: Reachable
          description: Whether Ollama answered.
        base_url:
          type: string
          title: Base Url
        vision_model:
          type: string
          title: Vision Model
        text_model:
          type: string
          title: Text Model
        models_installed:
          items:
            type: string
          type: array
          title: Models Installed
          description: Models that Ollama already holds.
        vision_model_installed:
          type: boolean
          title: Vision Model Installed
          default: false
        text_model_installed:
          type: boolean
          title: Text Model Installed
          default: false
        gpu_available:
          type: boolean
          title: Gpu Available
