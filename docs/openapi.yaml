          - type: string
          - type: 'null'
          title: Total Amount
        currency:
          type: string
          title: Currency
        version:
          type: integer
          title: Version
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - user_id
      - file_path
      - thumbnail_path
      - vendor
      - purchase_date
      - total_amount
      - currency
      - version
      - created_at
      - updated_at
      title: ReceiptRead
      description: A receipt in a list.
    ReceiptUpdate:
      properties:
        vendor:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Vendor
        purchase_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Purchase Date
        total_amount:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Total Amount
        currency:
          anyOf:
          - type: string
            maxLength: 3
            minLength: 3
          - type: 'null'
          title: Currency
      type: object
      title: ReceiptUpdate
      description: Correct the data read from a receipt.
    RecognizeResult:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RecognizedItem'
          type: array
          title: Items
        model:
          type: string
          title: Model
        duration_ms:
          type: integer
          title: Duration Ms
        image_count:
          type: integer
          title: Image Count
          description: How many photographs the model read.
          default: 1
        ocr_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Ocr Text
          description: The text that OCR read from the photographs, if any.
      type: object
      required:
      - model
      - duration_ms
      title: RecognizeResult
      description: The result of a recognize job or a bulk scan job.
    RecognizedItem:
      properties:
        name:
          type: string
          title: Name
        brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Read from a label or a rating plate.
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
          description: Only when the text of a photograph shows it.
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        subcategory:
          anyOf:
          - type: string
          - type: 'null'
          title: Subcategory
        estimated_value_aud:
          anyOf:
          - type: string
          - type: 'null'
          title: Estimated Value Aud
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: The model's own confidence, if it reports one.
        region:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 4
            minItems: 4
          - type: 'null'
          title: Region
          description: A bounding box as [x, y, width, height], for a bulk scan.
      type: object
      required:
      - name
      title: RecognizedItem
      description: One item that the vision model found in a photograph.
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
      description: The body of POST /api/auth/refresh.
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
      type: object
      required:
      - email
      - name
      - password
      title: RegisterRequest
      description: The body of POST /api/auth/register.
    SyncChange:
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        op:
          $ref: '#/components/schemas/SyncOp'
        id:
          type: string
          format: uuid
          title: Id
          description: The client creates the UUID, so a create is repeatable.
        base_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Base Version
          description: The version the client last saw. Used to detect a conflict.
        payload:
          anyOf:
          - type: object
          - type: 'null'
          title: Payload
          description: The row fields. Null for a delete.
        client_updated_at:
          type: string
          format: date-time
          title: Client Updated At
      type: object
      required:
      - entity
      - op
      - id
      - client_updated_at
      title: SyncChange
      description: One change that the client made while it was offline.
    SyncChanges:
      properties:
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
        server_time:
          type: string
          format: date-time
          title: Server Time
          description: Send this value back as ``since`` on the next sync.
        items:
          items:
            $ref: '#/components/schemas/ItemRead'
          type: array
          title: Items
        item_photos:
          items:
            $ref: '#/components/schemas/ItemPhotoRead'
          type: array
          title: Item Photos
        locations:
          items:
            $ref: '#/components/schemas/LocationRead'
          type: array
          title: Locations
        tags:
          items:
            $ref: '#/components/schemas/TagRead'
          type: array
          title: Tags
        receipts:
          items:
            $ref: '#/components/schemas/ReceiptRead'
          type: array
          title: Receipts
        maintenance_logs:
          items:
            $ref: '#/components/schemas/MaintenanceRead'
          type: array
          title: Maintenance Logs
        custom_fields:
          items:
            $ref: '#/components/schemas/CustomFieldRead'
          type: array
          title: Custom Fields
        deleted:
          additionalProperties:
            items:
              type: string
              format: uuid
            type: array
          propertyNames:
            $ref: '#/components/schemas/SyncEntity'
          type: object
          title: Deleted
        has_more:
          type: boolean
          title: Has More
          description: True when the page limit cut the result. Sync again.
          default: false
      type: object
      required:
      - since
      - server_time
      title: SyncChanges
      description: 'Everything that changed on the server since a timestamp.


        ``deleted`` holds the ids of soft deleted rows. A hard delete cannot

        appear in a delta query, so every user table keeps a ``deleted_at``

        tombstone instead.'
    SyncConflict:
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id:
          type: string
          format: uuid
          title: Id
        reason:
          type: string
          title: Reason
        server_version:
          type: integer
          title: Server Version
      type: object
      required:
      - entity
      - id
      - reason
      - server_version
      title: SyncConflict
      description: 'A change that the server overwrote.


        The server always wins. The client shows a message and takes the server

        value.'
    SyncEntity:
      type: string
      enum:
      - item
      - item_photo
      - location
      - tag
      - receipt
      - maintenance
      - custom_field
      title: SyncEntity
      description: The tables that the mobile application mirrors.
    SyncError:
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id:
          type: string
          format: uuid
          title: Id
        message:
          type: string
          title: Message
      type: object
      required:
      - entity
      - id
      - message
      title: SyncError
      description: 'A change that the server could not write at all.


        A conflict is not an error: the server simply held a newer copy. This is

        a change that never applied, so the client must keep it and fix it.'
    SyncOp:
      type: string
      enum:
      - create
      - update
      - delete
      title: SyncOp
      description: What the client did to a row while it was offline.
    SyncPush:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/SyncChange'
          type: array
          maxItems: 500
          minItems: 1
          title: Changes
      type: object
      required:
      - changes
      title: SyncPush
      description: A batch of offline changes.
    SyncPushResult:
      properties:
        applied:
          type: integer
          title: Applied
        rejected:
          type: integer
          title: Rejected
        conflicts:
          items:
            $ref: '#/components/schemas/SyncConflict'
          type: array
          title: Conflicts
        errors:
          items:
            $ref: '#/components/schemas/SyncError'
          type: array
          title: Errors
          description: Changes that failed. The client keeps these and retries.
        server_time:
          type: string
          format: date-time
          title: Server Time
      type: object
      required:
      - applied
      - rejected
      - server_time
      title: SyncPushResult
      description: What the server did with a pushed batch.
    TagCreate:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          title: Color
          default: '#64748b'
      type: object
      required:
      - name
      title: TagCreate
      description: Create a tag.
    TagRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - name
      - color
      - created_at
      - updated_at
      title: TagRead
      description: A tag.
    TagUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 1
          - type: 'null'
          title: Name
        color:
          anyOf:
          - type: string
            pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          - type: 'null'
          title: Color
      type: object
      title: TagUpdate
      description: Change a tag. Every field is optional.
    TokenPair:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          description: Access token lifetime in seconds.
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      title: TokenPair
      description: The tokens returned after a successful sign in.
    UserRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          format: email
          title: Email
        name:
          type: string
          title: Name
        role:
          type: string
          title: Role
        is_active:
          type: boolean
          title: Is Active
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - email
      - name
      - role
      - is_active
      - created_at
      - updated_at
      title: UserRead
      description: A user, as the API returns it. The password hash never appears here.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: A JWT access token.
      scheme: bearer
